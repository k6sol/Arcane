name: Verify native Blender conversion

on:
  push:
    paths:
      - '.github/workflows/verify-blender-conversion.yml'
      - 'packages/asset-pipeline/**'
      - 'packages/core/src/spatial-math.ts'
      - 'packages/protocol/**'
      - 'apps/desktop/src/glb-preflight.ts'
      - 'workers/blender/**'
      - 'scripts/blender-test-runtime.py'
      - 'scripts/compile-product.mjs'
      - 'tests/native/**'
      - 'tests/unit/tree_structure_review_test.py'
      - 'tests/unit/uv_engine_test.py'
      - 'tests/fixtures/uv/**'
      - 'tests/unit/rock_joints_test.py'
      - 'tests/unit/tree_station_fidelity_test.py'
      - 'tests/unit/tree_budget_allocation_test.py'
      - 'tests/unit/procedural_generator_test.py'
      - 'tests/unit/asset-worker-identity-windows.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  pull_request:
    paths:
      - '.github/workflows/verify-blender-conversion.yml'
      - 'packages/asset-pipeline/**'
      - 'packages/core/src/spatial-math.ts'
      - 'packages/protocol/**'
      - 'apps/desktop/src/glb-preflight.ts'
      - 'workers/blender/**'
      - 'scripts/blender-test-runtime.py'
      - 'scripts/compile-product.mjs'
      - 'tests/native/**'
      - 'tests/unit/tree_structure_review_test.py'
      - 'tests/unit/uv_engine_test.py'
      - 'tests/fixtures/uv/**'
      - 'tests/unit/rock_joints_test.py'
      - 'tests/unit/tree_station_fidelity_test.py'
      - 'tests/unit/tree_budget_allocation_test.py'
      - 'tests/unit/procedural_generator_test.py'
      - 'tests/unit/asset-worker-identity-windows.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcane-native-blender-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-conversion:
    name: Native Blender conversion (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source without persistent Git credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the actual tested pipeline
        run: npm run build
      - name: Verify the actual Windows process identity query
        if: ${{ runner.os == 'Windows' }}
        run: node --test --test-concurrency=1 dist/tests/unit/asset-worker-identity-windows.test.js
      - name: Verify bounded runtime archive handling
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: python tests/native/blender_runtime_install_test.py
      - name: Verify conversion file custody and failure reasons
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: python tests/native/conversion_audit_io_test.py
      - name: Verify geometry mismatch diagnostics
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: python tests/native/conversion_audit_geometry_test.py
      - name: Verify exact correspondence and physical precision limits
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: python tests/native/conversion_fidelity_policy_test.py
      - name: Verify same-job tree review identity and state restoration
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: python tests/unit/tree_structure_review_test.py
      - name: Verify UV orientation and deep-chart quality
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: >-
          python tests/unit/uv_engine_test.py
          SeamSelection.test_branch_junction_fallback_never_returns_folded_charts
          SeamSelection.test_deep_branch_chart_keeps_its_distortion_target
          SeamSelection.test_rejected_charts_have_bounded_recursion_on_skewed_geometry
      - name: Verify bounded native tree failure evidence
        run: node --test tests/native/tree-structure-evidence.test.mjs
      - name: Verify branch budgets and emitted foliage attachments
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: python tests/unit/tree_budget_allocation_test.py
      - name: Verify safe worker failure classification
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: python tests/unit/asset_worker_failure_test.py
      - name: Verify costed branch station fidelity
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: python tests/unit/tree_station_fidelity_test.py
      - name: Verify deterministic wood allocation and bark cap UV winding
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: >-
          python tests/unit/procedural_generator_test.py
          GeneratorContract.test_natural_broadleaf_is_deterministic_with_baselined_counts
          GeneratorContract.test_natural_wood_cap_uv_winding_preserves_geometry_and_other_authored_uvs
      - name: Acquire and verify the pinned official Blender runtime
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: python scripts/blender-test-runtime.py --github-env
      - name: Verify real source conversion and owned cancellation
        id: native-conversion
        run: node --test --test-concurrency=1 tests/native/blender-conversion.test.mjs
      - name: Verify generated mesh material slots in actual Blender
        run: node --test tests/native/procedural-material-slots.test.mjs
      - name: Verify height-aware oak atlas contracts in actual Blender
        run: node --test tests/native/oak-height-atlas.test.mjs
      - name: Verify weathered boulder joint contracts in actual Blender
        run: node --test tests/native/rock-joints.test.mjs
      - name: Verify actual foliage card attachment and native save/reopen
        id: native-foliage
        run: node --test --test-concurrency=1 tests/native/foliage-attachment.test.mjs
      - name: Verify actual current boulder and retain native review views
        id: native-rock
        run: node --test --test-concurrency=1 tests/native/rock-quality.test.mjs
      - name: Verify original tree structure views and exact-source reopen
        id: native-tree
        run: node --test --test-concurrency=1 tests/native/tree-structure.test.mjs
      - name: Retain original tree structure evidence
        if: ${{ always() && steps.native-tree.outcome != 'skipped' && steps.native-tree.outcome != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arcane-tree-structure-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            runtime/ci-tree-structure-artifacts/tree-structure.json
            runtime/ci-tree-structure-artifacts/preview-hero.png
            runtime/ci-tree-structure-artifacts/preview-side.png
            runtime/ci-tree-structure-artifacts/preview-structure.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain tall oak structure evidence
        if: ${{ always() && steps.native-tree.outcome != 'skipped' && steps.native-tree.outcome != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arcane-tall-tree-structure-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            runtime/ci-tall-tree-structure-artifacts/tree-structure.json
            runtime/ci-tall-tree-structure-artifacts/preview-hero.png
            runtime/ci-tall-tree-structure-artifacts/preview-side.png
            runtime/ci-tall-tree-structure-artifacts/preview-structure.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain bounded native conversion evidence
        if: ${{ always() && steps.native-conversion.outcome != 'skipped' && steps.native-conversion.outcome != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arcane-blender-conversion-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            runtime/ci-blender-conversion-artifacts/native-conversion.json
            runtime/ci-blender-conversion-artifacts/none-hero.png
            runtime/ci-blender-conversion-artifacts/none-side.png
            runtime/ci-blender-conversion-artifacts/hull-hero.png
            runtime/ci-blender-conversion-artifacts/hull-side.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain bounded foliage attachment evidence
        if: ${{ always() && steps.native-foliage.outcome != 'skipped' && steps.native-foliage.outcome != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arcane-foliage-attachment-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            runtime/ci-foliage-attachment-artifacts/foliage-attachment.json
            runtime/ci-foliage-attachment-artifacts/foliage-front.png
            runtime/ci-foliage-attachment-artifacts/foliage-side.png
            runtime/ci-foliage-attachment-artifacts/foliage-alpha-front.png
            runtime/ci-foliage-attachment-artifacts/foliage-alpha-oblique.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain bounded current boulder review evidence
        if: ${{ always() && steps.native-rock.outcome != 'skipped' && steps.native-rock.outcome != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arcane-rock-quality-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            runtime/ci-rock-quality-artifacts/rock-quality.json
            runtime/ci-rock-quality-artifacts/rock-hero.png
            runtime/ci-rock-quality-artifacts/rock-side.png
          if-no-files-found: error
          retention-days: 7
