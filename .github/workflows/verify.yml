name: Verify Arcane local components

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep checks for earlier commits running when another update is pushed.
  group: arcane-verify-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  local-contracts:
    name: Local contracts (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    # Partition the complete inventory; each lane retains the existing job and
    # per-test/runtime deadlines, assertions and serialized unit execution.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [unit-1, unit-2, release]
    steps:
      - name: Check out source without persistent Git credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Acquire and verify pinned standalone Luau for mandatory VM tests
        run: node scripts/luau-test-runtime.mjs --install --github-env
      - name: Strict type checking
        run: npm run typecheck
      - name: Warm the trusted Windows permission host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -Command '$ErrorActionPreference="Stop"; $PSModuleAutoLoadingPreference="None"; $null=[Reflection.Assembly]::Load("System.Web.Extensions, Version=4.0.0.0, Culture=neutral, PublicKeyToken=31bf3856ad364e35"); $nativeJson=[Web.Script.Serialization.JavaScriptSerializer]::new(); $nativeJson.MaxJsonLength=8192; $nativeJson.RecursionLimit=8; $identity=[Security.Principal.WindowsIdentity]::GetCurrent(); $acl=[IO.Directory]::GetAccessControl($env:SystemRoot); $rules=$acl.GetAccessRules($true,$true,[Security.Principal.SecurityIdentifier]); $null=$nativeJson.Serialize(@{version=1;powerShell=$PSVersionTable.PSVersion.ToString();tokenOwnerIsUser=($identity.Owner.Value -eq $identity.User.Value);ancestors=@(@{ruleCount=$rules.Count});directory=@{ownerIsUser=($acl.GetOwner([Security.Principal.SecurityIdentifier]).Value -eq $identity.User.Value)}})'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build product for the selected inventory
        run: npm run build
      - name: Verify private storage on Windows
        if: runner.os == 'Windows'
        run: |
          node --test --test-concurrency=1 dist/tests/unit/workflow-normal-owner.test.js dist/tests/unit/workflow-permission-equivalence.test.js
      - name: Test complete unit inventory shard 1 of 2
        if: matrix.suite == 'unit-1'
        run: node --test --test-concurrency=1 --test-shard=1/2 dist/tests/unit/*.test.js
      - name: Test complete unit inventory shard 2 of 2
        if: matrix.suite == 'unit-2'
        run: node --test --test-concurrency=1 --test-shard=2/2 dist/tests/unit/*.test.js
      - name: Test offline skill contracts
        if: matrix.suite == 'release'
        run: node --test tests/skills/*.test.mjs
      - name: Test release contracts
        if: matrix.suite == 'release'
        run: node --test --test-concurrency=1 tests/release/*.test.mjs
      - name: Build deterministic Studio plugin
        if: matrix.suite == 'release'
        run: npm run build:plugin
      - name: Verify deterministic Studio plugin artifacts
        if: matrix.suite == 'release'
        run: node scripts/build-plugin.mjs --check
      - name: Test deterministic Studio plugin
        if: matrix.suite == 'release'
        run: npm run test:plugin
      - name: Validate actual skill file integrity
        if: matrix.suite == 'release'
        run: node scripts/skill-pack.mjs validate
      # No CLI login, provider inference, real Studio, or live project operations.

