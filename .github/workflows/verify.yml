name: Verify Arcane local components

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep checks for earlier commits running when another update is pushed.
  group: arcane-verify-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  local-contracts:
    name: Local contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Current serialized Windows offline inventory: 805 cases, ~11 minutes.
    # This is a whole-job budget, not a relaxation of per-test/runtime deadlines.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source without persistent Git credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Acquire and verify pinned standalone Luau for mandatory VM tests
        run: node scripts/luau-test-runtime.mjs --install --github-env
      - name: Strict type checking
        run: npm run typecheck
      - name: Warm the trusted Windows permission host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -Command '[Security.Principal.WindowsIdentity]::GetCurrent() | Out-Null; [IO.Directory]::GetAccessControl($env:SystemRoot) | Out-Null'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify private storage on Windows
        if: runner.os == 'Windows'
        run: |
          npm run build
          node --test --test-concurrency=1 dist/tests/unit/workflow-normal-owner.test.js dist/tests/unit/workflow-permission-equivalence.test.js
      - name: Build and test metadata, HTTP and offline skill contracts
        run: npm test
      - name: Build and verify deterministic Studio plugin
        run: |
          npm run build:plugin
          node scripts/build-plugin.mjs --check
          npm run test:plugin
      - name: Validate actual skill file integrity
        run: node scripts/skill-pack.mjs validate
      # No CLI login, provider inference, real Studio, or live project operations.

