name: Verify Arcane local components

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep checks for earlier commits running when another update is pushed.
  group: arcane-verify-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  local-contracts:
    name: Local contracts (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    # Partition the complete inventory; each lane retains the existing
    # per-test/runtime deadlines, assertions and serialized unit execution.
    # The Windows release lane grows with the shipped frontend inventory
    # (each required file is verified with its own release build).
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [unit-1, unit-2, release]
    steps:
      - name: Check out source without persistent Git credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Acquire and verify pinned standalone Luau for mandatory VM tests
        run: node scripts/luau-test-runtime.mjs --install --github-env
      - name: Strict type checking
        run: npm run typecheck
      - name: Warm the trusted Windows permission host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -Command '$ErrorActionPreference="Stop"; $PSModuleAutoLoadingPreference="None"; $null=[Reflection.Assembly]::Load("System.Web.Extensions, Version=4.0.0.0, Culture=neutral, PublicKeyToken=31bf3856ad364e35"); $nativeJson=[Web.Script.Serialization.JavaScriptSerializer]::new(); $nativeJson.MaxJsonLength=8192; $nativeJson.RecursionLimit=8; $identity=[Security.Principal.WindowsIdentity]::GetCurrent(); $acl=[IO.Directory]::GetAccessControl($env:SystemRoot); $rules=$acl.GetAccessRules($true,$true,[Security.Principal.SecurityIdentifier]); $null=$nativeJson.Serialize(@{version=1;powerShell=$PSVersionTable.PSVersion.ToString();tokenOwnerIsUser=($identity.Owner.Value -eq $identity.User.Value);ancestors=@(@{ruleCount=$rules.Count});directory=@{ownerIsUser=($acl.GetOwner([Security.Principal.SecurityIdentifier]).Value -eq $identity.User.Value)}})'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build product for the selected inventory
        run: npm run build
      - name: Build deterministic Studio plugin
        run: npm run build:plugin
      - name: Verify deterministic Studio plugin artifacts
        run: node scripts/build-plugin.mjs --check
      - name: Prepare Windows owner policy metadata fixture
        if: runner.os == 'Windows'
        timeout-minutes: 1
        run: node scripts/prepare-windows-owner-policy-fixture.mjs
      - name: Verify private storage on Windows
        if: runner.os == 'Windows'
        run: |
          node --test --test-concurrency=1 dist/tests/unit/workflow-normal-owner.test.js dist/tests/unit/workflow-permission-equivalence.test.js
      - name: Test complete unit inventory shard 1 of 2
        if: matrix.suite == 'unit-1'
        run: node --test --test-concurrency=1 --test-shard=1/2 dist/tests/unit/*.test.js
      - name: Test complete unit inventory shard 2 of 2
        if: matrix.suite == 'unit-2'
        run: node --test --test-concurrency=1 --test-shard=2/2 dist/tests/unit/*.test.js
      - name: Type-check account and billing service
        if: matrix.suite == 'release'
        run: node node_modules/typescript/bin/tsc -p services/gateway/tsconfig.json
      - name: Test account and billing service
        if: matrix.suite == 'release'
        run: node --test --test-concurrency=1 services/gateway/test/*.test.ts
      - name: Test offline skill contracts
        if: matrix.suite == 'release'
        run: node --test tests/skills/*.test.mjs
      - name: Verify desktop setup and model previews in Edge
        if: runner.os == 'Windows' && matrix.suite == 'release'
        shell: pwsh
        env:
          ARCANE_UI_BROWSER_MODULE: ${{ github.workspace }}/node_modules/playwright-core/index.mjs
          ARCANE_UI_BUILD_DIR: ${{ github.workspace }}/dist
        run: |
          $edgeCandidates = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
          )
          $edgeExecutable = $edgeCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $edgeExecutable) { throw 'Microsoft Edge is required for desktop key control verification.' }
          $env:ARCANE_UI_BROWSER_EXE = $edgeExecutable
          node --test --test-concurrency=1 dist/tests/unit/studio-key-onboarding-browser.test.js dist/tests/unit/studio-key-settings-ui.test.js dist/tests/unit/welcome-tour.test.js dist/tests/unit/gui-revamp-layout-browser.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 dist/tests/unit/provider-setup-ui.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 dist/tests/unit/studio-diagnostics-ui.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 dist/tests/unit/chat-attachments-browser.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 dist/tests/unit/playtest-history-browser.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ARCANE_VIEWER_BROWSER = $edgeExecutable
          node --test --test-concurrency=1 tests/browser/asset-viewer-renderer.test.mjs tests/browser/asset-viewer-resize.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ARCANE_VIEWER_PRODUCT_EMIT = $env:ARCANE_UI_BUILD_DIR
          $env:ARCANE_VIEWER_PRODUCT_BROWSER = $edgeExecutable
          $env:ARCANE_VIEWER_PRODUCT_GPU = "1"
          node --test --test-concurrency=1 tests/browser/asset-viewer-product.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 dist/tests/unit/claude-chat-ui.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 services/gateway/test/account-routes.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test deterministic Studio plugin
        if: matrix.suite == 'release'
        run: npm run test:plugin
      - name: Test release contracts
        if: matrix.suite == 'release'
        run: node --test --test-concurrency=1 tests/release/*.test.mjs
      - name: Retain verified modular Studio plugin artifacts
        if: runner.os == 'Windows' && matrix.suite == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arcane-studio-plugin-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            plugin/build/manifest.json
            plugin/build/ArcaneLocalBridge.rbxm
            plugin/build/ArcaneLocalBridge.rbxmx
          if-no-files-found: error
          retention-days: 7
      - name: Validate actual skill file integrity
        if: matrix.suite == 'release'
        run: node scripts/skill-pack.mjs validate
      # No CLI login, provider inference, real Studio, or live project operations.

  packaged-desktop:
    name: Packaged desktop startup (windows-latest)
    needs: local-contracts
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out tested source without persistent Git credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build tested product
        run: npm run build
      - name: Build modular Studio plugin artifacts
        run: npm run build:plugin
      - name: Verify isolated packaged desktop startup and shutdown
        id: native-smoke
        run: node scripts/check-packaged-component-ci.mjs
      - name: Retain bounded packaged desktop evidence
        if: ${{ always() && steps.native-smoke.outcome != 'skipped' && steps.native-smoke.outcome != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arcane-windows-component-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            runtime/ci-desktop-smoke-artifacts/progress.json
            runtime/ci-desktop-smoke-artifacts/success.json
            runtime/ci-desktop-smoke-artifacts/failure.json
            runtime/ci-desktop-smoke-artifacts/toolchain.json
            runtime/ci-desktop-smoke-artifacts/package-proof.json
            runtime/ci-desktop-smoke-artifacts/windows-manifest.json
            runtime/ci-desktop-smoke-artifacts/verification.json
            runtime/ci-desktop-smoke-artifacts/process-outcome.json
            runtime/ci-desktop-smoke-artifacts/mcp-runtime.json
            runtime/ci-desktop-smoke-artifacts/app-checks.json
            runtime/ci-desktop-smoke-artifacts/workspace.png
            runtime/ci-desktop-smoke-artifacts/app-error.json
          if-no-files-found: error
          retention-days: 7

